install_command = pip install -c{toxinidir}/constraints.txt -U {opts:} {packages:}
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  ARGS="-V"
deps =
    -r{toxinidir}/requirements-dev.txt
    -r{toxinidir}/circuit_functions/vanilla/requirements.txt
commands =
  stestr --test-path circuit_functions/vanilla/test run {posargs}

[testenv:lint]
basepython = python3
deps = 
  -r{toxinidir}/requirements-dev.txt
commands =
  black --check {posargs} base_templates tools physics chemistry circuit_functions
  pylint -rn base_templates tools physics chemistry circuit_functions
  python {toxinidir}/tools/verify_headers.py base_templates tools physics circuit_functions
allowlist_externals = black

[testenv:black]
skip_install = true
deps =
    -r requirements-dev.txt
commands = black {posargs} base_templates tools physics chemistry circuit_functions

[testenv:coverage]
basepython = python3
setenv =
  {[testenv]setenv}
  PYTHON=coverage3 run --source qiskit
commands =
  stestr run {posargs}
  coverage3 combine
  coverage3 report