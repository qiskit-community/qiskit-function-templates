[tox]
minversion = 4.0
envlist = lint-incr, hamsim, trotter-aqc, sqdpcm, circuit-executor, circuit-vanilla
isolated_build = true

[testenv:hamsim]
# The colons in the substitutions below let us re-use the `install_command` in
# places where `tox` doesn't automatically fill in those values.
install_command = pip install -c{toxinidir}/constraints.txt -U {opts:} {packages:}
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  ARGS="-V"
deps =
    -r{toxinidir}/requirements-dev.txt
    -r{toxinidir}/physics/hamiltonian_simulation/requirements.txt
commands =
  stestr --test-path physics/hamiltonian_simulation/test run {posargs}

[testenv:trotter-aqc]
# The colons in the substitutions below let us re-use the `install_command` in
# places where `tox` doesn't automatically fill in those values.
install_command = pip install -c{toxinidir}/constraints.txt -U {opts:} {packages:}
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  ARGS="-V"
deps =
    -r{toxinidir}/requirements-dev.txt
    -r{toxinidir}/physics/trotter_aqc_hamiltonian/requirements.txt
commands =
  stestr --test-path physics/trotter_aqc_hamiltonian/test run {posargs}

