  ARGS="-V"
deps =
    -r{toxinidir}/requirements-dev.txt
    -r{toxinidir}/chemistry/sqd_pcm/requirements.txt
changedir = {toxinidir}/chemistry/sqd_pcm
commands =
  stestr --test-path test run {posargs}

