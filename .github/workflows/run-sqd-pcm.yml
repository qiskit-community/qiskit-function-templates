name: SQD-PCM Tests

on:
  push:
    branches: [main]
    paths:
      - 'chemistry/sqd_pcm/**'
      - 'requirements-dev.txt'

  pull_request:
    branches: [main]
    paths:
      - 'chemistry/sqd_pcm/**'
      - 'requirements-dev.txt'

jobs:
  call-tests:
    uses: ./.github/workflows/_unit-tests.yml
    with:
      dir: chemistry/sqd_pcm
      os-list: '["ubuntu-latest"]'
